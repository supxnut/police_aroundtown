version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=super-secret-police-mdt-key-2026
      - DISCORD_ADMIN_IDS=100000000000000001,100000000000000002
    volumes:
      - ../uploads:/app/uploads
      - ../police_mdt.sqlite:/app/police_mdt.sqlite
    restart: always

  sync-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_DUTY_CHANNEL_ID=${DISCORD_DUTY_CHANNEL_ID}
      - DISCORD_CASE_CHANNEL_ID=${DISCORD_CASE_CHANNEL_ID}
      - DISCORD_ANNOUNCEMENT_CHANNEL_ID=${DISCORD_ANNOUNCEMENT_CHANNEL_ID}
      - DISCORD_SYSTEM_CHANNEL_ID=${DISCORD_SYSTEM_CHANNEL_ID}
    volumes:
      - ../uploads:/app/uploads
      - ../police_mdt.sqlite:/app/police_mdt.sqlite
    restart: always
